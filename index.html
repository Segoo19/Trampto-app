          "@id": "https://trampto-app.vercel.app/#website",

  <body>
    <!-- Splash de arranque: se pinta sin JS (instantáneo) y main.tsx lo
         desvanece cuando React ya ha montado. Solo presentación. -->
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(120% 80% at 50% 0%,#ffffff 0%,#eef2fb 55%,#e6ebf6 100%);transition:opacity .45s cubic-bezier(.22,1,.36,1),visibility .45s}
      #splash.hide{opacity:0;visibility:hidden}
      #splash .sp-logo{width:104px;height:104px;border-radius:28px;background:#fff url(/icon-192.png) center/88% no-repeat;box-shadow:0 1px 2px rgba(13,27,75,.06),0 22px 50px -18px rgba(13,27,75,.35);animation:sp-in .7s cubic-bezier(.22,1,.36,1) both,sp-breathe 2.4s ease-in-out .7s infinite}
      #splash .sp-name{font:700 15px/1 "DM Sans",system-ui,sans-serif;letter-spacing:.32em;color:#0d1b4b;padding-left:.32em;animation:sp-fade .8s .15s both}
      #splash .sp-bar{width:120px;height:3px;border-radius:99px;background:rgba(13,27,75,.08);overflow:hidden;animation:sp-fade .8s .25s both}
      #splash .sp-bar i{display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#c49a22,#ead7a1);animation:sp-load 1.1s cubic-bezier(.65,0,.35,1) infinite}
      @keyframes sp-in{from{opacity:0;transform:scale(.86) translateY(8px)}to{opacity:1;transform:none}}
      @keyframes sp-breathe{50%{transform:scale(1.035)}}
      @keyframes sp-fade{from{opacity:0}to{opacity:1}}
      @keyframes sp-load{from{transform:translateX(-110%)}to{transform:translateX(280%)}}
      @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
    </style>
    <div id="splash" aria-hidden="true">
      <div class="sp-logo"></div>
      <div class="sp-name">TRAMPTO</div>
      <div class="sp-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
